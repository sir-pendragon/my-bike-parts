name: Build CAD Model

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 1. リポジトリのコードを読み込む
      uses: actions/checkout@v4

    - name: 2. Pythonを準備する
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 3. CadQueryをインストールする
      run: pip install cadquery

    - name: 4. コードを実行してSTEPファイルを作る
      run: python headset_spacer.py

    - name: 5. できたSTEPファイルをダウンロードできるようにする
      uses: actions/upload-artifact@v4
      with:
        name: headset-spacer-step
        path: headset_spacer.step
